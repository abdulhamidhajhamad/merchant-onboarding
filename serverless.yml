service: merchant-onboarding

provider:
  name: aws
  runtime: nodejs20.x
  timeout: 35
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'local'}
  environment:
    PORT: 3000
    AWS_REGION: ${self:provider.region}
    DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    S3_ENDPOINT: ${env:S3_ENDPOINT, ''}
    DYNAMODB_TABLE_NAME: !Ref ApplicationsTable
  apiGateway:
    minimumCompressionSize: 1024
    shouldStartNameStageMatching: false
    https: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
          Resource: !GetAtt ApplicationsTable.Arn
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
          Resource: !Sub "arn:aws:s3:::${MerchantDocumentsBucket}/*"

functions:
  app:
    handler: src/lambda.handler
    events:
      - http:
          path: /
          method: get
          cors: true
      - http:
          path: /health
          method: get
          cors: true
      - http:
          path: /{proxy+}
          method: any
          cors: true

plugins:
  - serverless-offline
  - serverless-dynamodb-local
  - serverless-s3-local

custom:
  dynamodb:
    start:
      port: 8000
      inMemory: true
      migrate: true
  s3:
    local:
      port: 9000
      accessKeyId: mock
      secretAccessKey: mock

resources:
  Resources:
    ApplicationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: merchant-applications-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

    MerchantDocumentsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: merchant-documents-${self:provider.stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        LifecycleConfiguration:
          Rules:
            - Id: CleanupAbandonedDocuments
              Status: Enabled
              ExpirationInDays: 90